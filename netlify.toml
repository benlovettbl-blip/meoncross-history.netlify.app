[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  # Ensure the service worker is never cached by the browser HTTP cache
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  # By default, force the browser to check if the file has changed (for HTML, PDFs, public/style.css)
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Vite hashes all JS/CSS in the /assets/ folder, so those can be cached forever safely
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
