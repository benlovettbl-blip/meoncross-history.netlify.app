[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[headers]]
  # Service worker: strictly no-cache, anti-indexing
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Surrogate-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  # Root entrypoint: strictly no-cache, anti-indexing
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Surrogate-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  # HTML index: strictly no-cache, anti-indexing
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Surrogate-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  # Netlify Functions (Chess Sync & Live API State)
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Surrogate-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  # API proxy route
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Surrogate-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  # Global fallback for app routes: strict no-cache, anti-indexing
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Surrogate-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  # Hashed Vite JS/CSS assets in /assets/ folder
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
