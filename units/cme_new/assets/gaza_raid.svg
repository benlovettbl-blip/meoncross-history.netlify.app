<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%" class="svg-diagram" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: transparent;">
  <defs>
    <filter id="card-shadow-g" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" flood-color="#0f172a"/>
    </filter>
    <marker id="arrow-head-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="440" y="22" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="800" letter-spacing="0.8">CAUSAL SEQUENCE: THE 1955 GAZA RAID TO THE SUEZ CRISIS</text>

  <!-- Connecting Arrows -->
  <path d="M 215 100 L 234 100" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-head-g)" fill="none"/>
  <path d="M 435 100 L 454 100" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-head-g)" fill="none"/>
  <path d="M 655 100 L 674 100" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-head-g)" fill="none"/>

  <!-- Card 1 -->
  <g transform="translate(20, 36)">
    <rect width="195" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow-g)"/>
    <rect width="195" height="28" rx="8" fill="#eff6ff"/>
    <rect x="8" y="6" width="98" height="16" rx="4" fill="#1e40af"/>
    <text x="57" y="18" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" letter-spacing="0.4">STEP 1 • FEB 1955</text>
    <text x="12" y="46" fill="#0f172a" font-size="12" font-weight="700">The Gaza Raid</text>
    <text x="12" y="66" fill="#475569" font-size="10">
      <tspan x="12" dy="0">IDF reprisal raid kills 37</tspan>
      <tspan x="12" dy="14">Egyptian soldiers in Gaza.</tspan>
      <tspan x="12" dy="14">Catastrophic humiliation</tspan>
      <tspan x="12" dy="14">exposes military weakness.</tspan>
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(240, 36)">
    <rect width="195" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow-g)"/>
    <rect width="195" height="28" rx="8" fill="#f5f3ff"/>
    <rect x="8" y="6" width="104" height="16" rx="4" fill="#6d28d9"/>
    <text x="60" y="18" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" letter-spacing="0.4">STEP 2 • SEPT 1955</text>
    <text x="12" y="46" fill="#0f172a" font-size="12" font-weight="700">Czech Arms Deal</text>
    <text x="12" y="66" fill="#475569" font-size="10">
      <tspan x="12" dy="0">West refuses arms sales;</tspan>
      <tspan x="12" dy="14">Nasser buys $250m Soviet</tspan>
      <tspan x="12" dy="14">hardware (200 MiG-15 jets,</tspan>
      <tspan x="12" dy="14">300 tanks) via Prague.</tspan>
    </text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(460, 36)">
    <rect width="195" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow-g)"/>
    <rect width="195" height="28" rx="8" fill="#fffbeb"/>
    <rect x="8" y="6" width="105" height="16" rx="4" fill="#b45309"/>
    <text x="60.5" y="18" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" letter-spacing="0.4">STEP 3 • JULY 1956</text>
    <text x="12" y="46" fill="#0f172a" font-size="12" font-weight="700">Dam Loans Cancelled</text>
    <text x="12" y="66" fill="#475569" font-size="10">
      <tspan x="12" dy="0">Alarmed by Soviet arms &amp;</tspan>
      <tspan x="12" dy="14">China ties, US &amp; Britain</tspan>
      <tspan x="12" dy="14">abruptly cancel promised</tspan>
      <tspan x="12" dy="14">loans for Aswan High Dam.</tspan>
    </text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(680, 36)">
    <rect width="180" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow-g)"/>
    <rect width="180" height="28" rx="8" fill="#ecfdf5"/>
    <rect x="8" y="6" width="112" height="16" rx="4" fill="#047857"/>
    <text x="64" y="18" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" letter-spacing="0.4">STEP 4 • 26 JULY 1956</text>
    <text x="12" y="46" fill="#0f172a" font-size="12" font-weight="700">Canal Nationalised</text>
    <text x="12" y="66" fill="#475569" font-size="10">
      <tspan x="12" dy="0">Nasser seizes Suez Canal;</tspan>
      <tspan x="12" dy="14">uses £35m annual transit</tspan>
      <tspan x="12" dy="14">tolls to fund Aswan Dam,</tspan>
      <tspan x="12" dy="14">defying European empires.</tspan>
    </text>
  </g>
</svg>