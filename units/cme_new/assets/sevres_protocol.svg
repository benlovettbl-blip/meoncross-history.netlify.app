<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%" class="svg-diagram" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: transparent;">
  <defs>
    <filter id="card-shadow-s" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" flood-color="#0f172a"/>
    </filter>
    <marker id="arrow-head-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="440" y="22" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="800" letter-spacing="0.8">THE SECRET PROTOCOL OF SÈVRES (OCTOBER 1956): TRIPARTITE COLLUSION</text>

  <!-- Connecting Arrows -->
  <path d="M 215 100 L 234 100" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-head-s)" fill="none"/>
  <path d="M 435 100 L 454 100" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-head-s)" fill="none"/>
  <path d="M 655 100 L 674 100" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-head-s)" fill="none"/>

  <!-- Card 1 -->
  <g transform="translate(20, 36)">
    <rect width="195" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow-s)"/>
    <rect width="195" height="28" rx="8" fill="#eff6ff"/>
    <rect x="8" y="6" width="102" height="16" rx="4" fill="#1e40af"/>
    <text x="59" y="18" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" letter-spacing="0.4">STEP 1 • 29 OCT 1956</text>
    <text x="12" y="46" fill="#0f172a" font-size="12" font-weight="700">Israeli Sinai Pretext</text>
    <text x="12" y="66" fill="#475569" font-size="10">
      <tspan x="12" dy="0">Israel launches surprise</tspan>
      <tspan x="12" dy="14">invasion of Sinai; drops</tspan>
      <tspan x="12" dy="14">paratroops near Mitla Pass,</tspan>
      <tspan x="12" dy="14">manufacturing armed war.</tspan>
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(240, 36)">
    <rect width="195" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow-s)"/>
    <rect width="195" height="28" rx="8" fill="#f5f3ff"/>
    <rect x="8" y="6" width="104" height="16" rx="4" fill="#4338ca"/>
    <text x="60" y="18" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" letter-spacing="0.4">STEP 2 • 30 OCT 1956</text>
    <text x="12" y="46" fill="#0f172a" font-size="12" font-weight="700">Joint Ultimatum</text>
    <text x="12" y="66" fill="#475569" font-size="10">
      <tspan x="12" dy="0">Britain &amp; France feign shock;</tspan>
      <tspan x="12" dy="14">demand both armies cease</tspan>
      <tspan x="12" dy="14">fire &amp; withdraw 10 miles</tspan>
      <tspan x="12" dy="14">from the Suez Canal.</tspan>
    </text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(460, 36)">
    <rect width="195" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow-s)"/>
    <rect width="195" height="28" rx="8" fill="#fffbeb"/>
    <rect x="8" y="6" width="102" height="16" rx="4" fill="#b45309"/>
    <text x="59" y="18" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" letter-spacing="0.4">STEP 3 • 31 OCT 1956</text>
    <text x="12" y="46" fill="#0f172a" font-size="12" font-weight="700">Egyptian Refusal</text>
    <text x="12" y="66" fill="#475569" font-size="10">
      <tspan x="12" dy="0">Egypt predictably refuses</tspan>
      <tspan x="12" dy="14">to abandon sovereign soil.</tspan>
      <tspan x="12" dy="14">Anglo-French air forces</tspan>
      <tspan x="12" dy="14">bomb Egyptian airfields.</tspan>
    </text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(680, 36)">
    <rect width="180" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow-s)"/>
    <rect width="180" height="28" rx="8" fill="#fef2f2"/>
    <rect x="8" y="6" width="98" height="16" rx="4" fill="#b91c1c"/>
    <text x="57" y="18" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" letter-spacing="0.4">STEP 4 • 5 NOV 1956</text>
    <text x="12" y="46" fill="#0f172a" font-size="12" font-weight="700">Canal Invasion</text>
    <text x="12" y="66" fill="#475569" font-size="10">
      <tspan x="12" dy="0">British &amp; French paratroops</tspan>
      <tspan x="12" dy="14">invade Port Said under false</tspan>
      <tspan x="12" dy="14">pretext of 'peacekeeping'</tspan>
      <tspan x="12" dy="14">to topple Nasser.</tspan>
    </text>
  </g>
</svg>