<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>

    <pattern id="fatahHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.25"/>
    </pattern>

    <marker id="arrow-katyusha" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background Base Map Grid -->
  <rect width="900" height="800" fill="#f8fafc"/>
  
  <!-- Map Title Banner / Archival Header -->
  <rect x="0" y="0" width="900" height="68" fill="#0f172a"/>
  <text x="24" y="28" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.5">CARTOGRAPHIC MAP: 'FATAHLAND' &amp; THE ARKOUB REGION</text>
  <text x="24" y="48" font-size="12" font-weight="500" fill="#94a3b8">SOUTHERN LEBANON &amp; THE UPPER GALILEE • PLO ROCKET LAUNCH CORRIDORS &amp; BASES (1969–1982)</text>
  <rect x="740" y="16" width="136" height="34" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="808" y="38" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">MILITARY INTELLIGENCE</text>

  <!-- Mediterranean Sea (West) -->
  <path d="M 0,68 L 220,68 C 210,220 180,450 140,800 L 0,800 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text transform="translate(70, 420) rotate(-78)" font-size="14" font-weight="800" fill="#0284c7" letter-spacing="2">MEDITERRANEAN SEA</text>

  <!-- Territorial Landmass -->
  <!-- Southern Lebanon (North) -->
  <path d="M 220,68 L 900,68 L 900,560 L 620,560 C 520,580 420,630 330,680 C 240,730 180,780 140,800 Z" fill="#f8fafc"/>

  <!-- Litani River -->
  <path d="M 900,180 C 720,200 580,240 450,230 C 340,220 280,280 200,310" fill="none" stroke="#0284c7" stroke-width="4.5"/>
  <text x="360" y="218" font-size="11" font-weight="800" fill="#0369a1" letter-spacing="1">LITANI RIVER</text>

  <!-- Hasbani River -->
  <path d="M 680,120 L 620,380 L 590,560" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Mount Hermon Massif (North-East Highlands) -->
  <path d="M 680,68 L 900,68 L 900,320 L 730,300 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="800" y="160" font-size="13" font-weight="900" fill="#475569" text-anchor="middle" letter-spacing="1.5">MOUNT HERMON</text>
  <text x="800" y="180" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">(JEBEL EL-SHEIKH • 2,814m)</text>

  <!-- THE ARKOUB REGION ('FATAHLAND') BASE ZONE -->
  <path d="M 520,220 L 780,240 L 760,490 L 530,470 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 3" filter="url(#subtle-shadow)"/>
  <path d="M 520,220 L 780,240 L 760,490 L 530,470 Z" fill="url(#fatahHatch)"/>

  <rect x="550" y="320" width="200" height="48" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="342" font-size="13" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="1.5">THE ARKOUB REGION</text>
  <text x="650" y="358" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle">('FATAHLAND' PLO AUTONOMOUS ZONE)</text>

  <!-- Key Towns in Southern Lebanon -->
  <!-- Tyre (Sur) -->
  <circle cx="185" cy="420" r="6" fill="#0f172a"/>
  <text x="175" y="415" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end">Tyre (Sur)</text>

  <!-- Sidon (Saida) -->
  <circle cx="215" cy="150" r="6" fill="#0f172a"/>
  <text x="205" y="145" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end">Sidon (Saida)</text>

  <!-- Nabatieh -->
  <circle cx="430" cy="330" r="5" fill="#334155"/>
  <text x="430" y="320" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Nabatieh</text>

  <!-- Beaufort Castle (Crusader fort used as PLO observation/artillery post) -->
  <g transform="translate(480, 390)" filter="url(#subtle-shadow)">
    <rect x="-10" y="-10" width="20" height="20" fill="#475569" stroke="#0f172a" stroke-width="1.5"/>
    <text x="0" y="24" font-size="9.5" font-weight="800" fill="#b91c1c" text-anchor="middle">Beaufort Castle</text>
    <text x="0" y="35" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">(PLO Strongpoint)</text>
  </g>

  <!-- Hasbaya & Chebaa in Arkoub -->
  <circle cx="640" cy="270" r="4.5" fill="#991b1b"/>
  <text x="652" y="274" font-size="9.5" font-weight="700" fill="#7f1d1d">Hasbaya</text>

  <circle cx="700" cy="380" r="4.5" fill="#991b1b"/>
  <text x="712" y="384" font-size="9.5" font-weight="700" fill="#7f1d1d">Chebaa</text>

  <circle cx="560" cy="430" r="4.5" fill="#991b1b"/>
  <text x="548" y="445" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Marjayoun</text>

  <!-- INTERNATIONAL BORDER (1949 ARMISTICE / BLUE LINE) -->
  <path d="M 155,620 C 240,600 340,610 440,620 C 500,620 540,580 580,580 C 600,580 620,530 650,520 L 720,520" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-dasharray="10 4 3 4"/>
  <text x="320" y="635" font-size="10.5" font-weight="800" fill="#1e3a8a" letter-spacing="1">1949 ARMISTICE BORDER (ISRAEL-LEBANON)</text>

  <!-- ISRAELI NORTHERN REGION (UPPER GALILEE PANHANDLE) -->
  <path d="M 155,620 C 240,600 340,610 440,620 C 500,620 540,580 580,580 C 600,580 620,530 650,520 L 720,520 L 900,520 L 900,800 L 140,800 Z" fill="#eff6ff"/>

  <text x="440" y="740" font-size="15" font-weight="900" fill="#1e40af" letter-spacing="2">STATE OF ISRAEL (UPPER GALILEE)</text>

  <!-- Israeli Border Towns -->
  <!-- Metula -->
  <circle cx="590" cy="565" r="5" fill="#1e40af"/>
  <text x="602" y="562" font-size="10" font-weight="800" fill="#1e3a8a">Metula</text>

  <!-- Kiryat Shmona -->
  <circle cx="570" cy="640" r="6" fill="#1e40af"/>
  <rect x="475" y="650" width="130" height="22" rx="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" filter="url(#subtle-shadow)"/>
  <text x="540" y="665" font-size="10" font-weight="800" fill="#1e40af" text-anchor="middle">Kiryat Shmona</text>

  <!-- Nahariya (Coast) -->
  <circle cx="150" cy="690" r="5.5" fill="#1e40af"/>
  <text x="165" y="694" font-size="10" font-weight="800" fill="#1e40af">Nahariya</text>

  <!-- PLO KATYUSHA ROCKET TRAJECTORIES & RANGES -->
  <!-- 122mm Katyusha Rocket Range Arc (20.5 km) -->
  <path d="M 640,310 C 600,430 570,550 550,630" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow-katyusha)"/>
  <path d="M 480,400 C 440,490 320,560 220,640" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow-katyusha)"/>

  <!-- Rocket trajectory badge -->
  <g transform="translate(680, 440)" filter="url(#subtle-shadow)">
    <rect x="-85" y="-12" width="170" height="24" rx="3" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="4" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">122mm Katyusha Trajectory</text>
  </g>

  <!-- MAP COMPASS & SCALE -->
  <g transform="translate(80, 140)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    <polygon points="0,-16 5,-2 -5,-2" fill="#0f172a"/>
    <polygon points="0,16 5,2 -5,2" fill="#94a3b8"/>
    <text x="0" y="-20" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">N</text>
  </g>
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="140" height="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>
    <rect x="10" y="6" width="60" height="6" fill="#0f172a"/>
    <rect x="70" y="6" width="60" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="10" y="4" font-size="7.5" font-weight="700" fill="#334155">0</text>
    <text x="70" y="4" font-size="7.5" font-weight="700" fill="#334155">10km</text>
    <text x="130" y="4" font-size="7.5" font-weight="700" fill="#334155">20km</text>
  </g>

  <!-- MAP LEGEND (Bottom Right Floating Card) -->
  <g transform="translate(580, 560)" filter="url(#shadow)">
    <rect width="300" height="210" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="300" height="28" rx="6 6 0 0" fill="#1e293b"/>
    <text x="150" y="19" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">CARTOGRAPHIC LEGEND</text>

    <!-- Legend Items -->
    <!-- Fatahland Perimeter -->
    <rect x="14" y="38" width="22" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="14" y1="38" x2="36" y2="52" stroke="#dc2626" stroke-width="1"/>
    <text x="46" y="50" font-size="9.5" font-weight="700" fill="#1e293b">'Fatahland' / Arkoub Autonomous Sector</text>

    <!-- Armistice Border -->
    <line x1="14" y1="72" x2="36" y2="72" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="6 3"/>
    <text x="46" y="75" font-size="9.5" font-weight="700" fill="#1e293b">1949 Armistice Border (Blue Line)</text>

    <!-- Katyusha Arcs -->
    <line x1="14" y1="98" x2="34" y2="98" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-katyusha)"/>
    <text x="46" y="102" font-size="9.5" font-weight="700" fill="#1e293b">Katyusha Rocket Infiltration / Launch Arcs</text>

    <!-- Beaufort Strongpoint -->
    <rect x="18" y="120" width="14" height="14" fill="#475569" stroke="#0f172a" stroke-width="1.5"/>
    <text x="46" y="131" font-size="9.5" font-weight="700" fill="#1e293b">Beaufort Castle &amp; Heavy Artillery Bunkers</text>

    <!-- Israeli Galilee Panhandle -->
    <rect x="14" y="148" width="22" height="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="46" y="160" font-size="9.5" font-weight="700" fill="#1e293b">Upper Galilee Communities (Target Zones)</text>

    <!-- Footer Note -->
    <text x="150" y="196" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Under 1969 Cairo Agreement (Lebanese Army Autonomy Grant)</text>
  </g>
</svg>
