<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" style="background:#fdfbf7; font-family:'Outfit', Arial, sans-serif;">
  <defs>
    <marker id="evac-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a"/>
    </marker>
  </defs>

  <!-- Parchment Frame -->
  <rect x="15" y="15" width="970" height="720" rx="8" fill="#fcfaf4" stroke="#334155" stroke-width="2"/>
  <rect x="23" y="23" width="954" height="704" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Surrounding Waters -->
  <!-- North Sea -->
  <text x="750" y="220" font-size="18" font-weight="700" fill="#0284c7" font-style="italic" letter-spacing="3" opacity="0.7">NORTH SEA</text>
  <!-- Irish Sea -->
  <text x="350" y="340" font-size="16" font-weight="700" fill="#0284c7" font-style="italic" letter-spacing="2" opacity="0.7">IRISH SEA</text>
  <!-- English Channel -->
  <text x="480" y="700" font-size="16" font-weight="700" fill="#0284c7" font-style="italic" letter-spacing="2" opacity="0.7">ENGLISH CHANNEL</text>

  <!-- Base Geography of Great Britain -->
  <!-- Scotland (Neutral/Rural Reception) -->
  <path d="M 440 40 C 470 60 520 80 500 130 C 490 170 540 180 510 220 L 430 220 C 400 190 380 150 400 90 Z" 
        fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>

  <!-- Northern England & Yorkshire (Mixed Evacuation & Reception) -->
  <path d="M 430 220 L 510 220 C 530 250 560 280 570 340 L 480 380 L 420 330 C 410 280 410 250 430 220 Z" 
        fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>

  <!-- Yorkshire Dales & Moors (Green Reception Area) -->
  <path d="M 480 250 C 520 250 550 270 540 310 C 520 320 480 300 480 250 Z" 
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Wales (Designated Safe Reception Area - Green) -->
  <path d="M 400 370 C 430 380 430 420 420 470 C 400 500 340 500 320 470 C 310 440 330 400 370 380 Z" 
        fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

  <!-- Midlands & Central England -->
  <path d="M 430 370 L 560 360 L 590 440 L 540 500 L 430 490 L 410 440 Z" 
        fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>

  <!-- East Anglia (Neutral / Military Coastal Defense Zone - Pale Blue/Buff) -->
  <path d="M 570 410 C 640 410 670 460 630 510 L 570 500 Z" 
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>

  <!-- South West: Devon & Cornwall & Somerset (Prime Green Reception Haven) -->
  <path d="M 430 520 L 470 520 L 440 560 L 370 580 L 260 620 C 230 630 220 610 250 590 L 330 550 L 390 530 Z" 
        fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

  <!-- South East & Home Counties (London Area & South Coast) -->
  <path d="M 470 500 L 580 500 L 630 530 L 610 580 L 520 580 L 470 550 Z" 
        fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>

  <!-- OFFICIAL 1939 HIGH-RISK EVACUATION ZONES (Target Cities in Red) -->
  
  <!-- 1. GREATER LONDON DANGER ZONE -->
  <ellipse cx="545" cy="530" rx="35" ry="25" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
  <circle cx="545" cy="530" r="5" fill="#dc2626"/>
  <text x="545" y="534" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">★</text>
  <rect x="510" y="542" width="70" height="20" rx="3" fill="#1e293b" stroke="#dc2626" stroke-width="1.2"/>
  <text x="545" y="556" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">LONDON</text>

  <!-- 2. BIRMINGHAM & BLACK COUNTRY -->
  <ellipse cx="480" cy="440" rx="22" ry="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="480" cy="440" r="4.5" fill="#dc2626"/>
  <text x="480" y="420" font-size="9" font-weight="800" fill="#991b1b" text-anchor="middle">Birmingham</text>

  <!-- 3. MANCHESTER & SALFORD -->
  <ellipse cx="475" cy="350" rx="20" ry="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="475" cy="350" r="4" fill="#dc2626"/>
  <text x="495" y="345" font-size="8.8" font-weight="800" fill="#991b1b">Manchester</text>

  <!-- 4. LIVERPOOL & MERSEYSIDE -->
  <ellipse cx="435" cy="355" rx="18" ry="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="435" cy="355" r="4" fill="#dc2626"/>
  <text x="390" y="352" font-size="8.8" font-weight="800" fill="#991b1b">Liverpool</text>

  <!-- 5. NEWCASTLE & TYNESIDE -->
  <ellipse cx="490" cy="235" rx="20" ry="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="490" cy="235" r="4" fill="#dc2626"/>
  <text x="490" y="222" font-size="8.8" font-weight="800" fill="#991b1b" text-anchor="middle">Newcastle</text>

  <!-- 6. PORTSMOUTH & SOUTHAMPTON NAVAL DOCKS -->
  <ellipse cx="505" cy="575" rx="22" ry="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="495" cy="575" r="3.5" fill="#dc2626"/>
  <circle cx="515" cy="575" r="3.5" fill="#dc2626"/>
  <text x="505" y="598" font-size="8.2" font-weight="800" fill="#991b1b" text-anchor="middle">Portsmouth / S'hampton</text>

  <!-- RECEPTION HAVENS (Green Region Badges) -->
  <!-- Rural Wales -->
  <rect x="330" y="420" width="85" height="24" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="372" y="434" font-size="9.5" font-weight="800" fill="#15803d" text-anchor="middle">RURAL WALES</text>
  <text x="372" y="442" font-size="7" font-weight="700" fill="#166534" text-anchor="middle">Reception Haven</text>

  <!-- Devon & Cornwall -->
  <rect x="290" y="580" width="100" height="24" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="594" font-size="9.5" font-weight="800" fill="#15803d" text-anchor="middle">DEVON &amp; CORNWALL</text>
  <text x="340" y="602" font-size="7" font-weight="700" fill="#166534" text-anchor="middle">Reception Haven</text>

  <!-- Yorkshire Dales -->
  <rect x="490" y="275" width="85" height="22" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="532" y="289" font-size="9" font-weight="800" fill="#15803d" text-anchor="middle">YORKSHIRE DALES</text>

  <!-- MAJOR RAILWAY EVACUATION CORRIDORS (Verified Ministry of Health Routes) -->
  
  <!-- Route 1: London to Devon & Cornwall (GWR from Paddington) -->
  <path d="M 525 535 C 470 545 420 545 370 570" 
        fill="none" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#evac-arrow)"/>
  <text x="440" y="560" font-size="8.2" font-weight="800" fill="#1e3a8a" transform="rotate(12 440 560)">To Devon &amp; Cornwall</text>

  <!-- Route 2: London to South & West Wales (GWR from Paddington) -->
  <path d="M 520 525 C 470 500 440 480 380 455" 
        fill="none" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#evac-arrow)"/>
  <text x="445" y="485" font-size="8.2" font-weight="800" fill="#1e3a8a" transform="rotate(-15 445 485)">To South &amp; West Wales</text>

  <!-- Route 3: Birmingham to Mid Wales -->
  <path d="M 465 440 C 440 440 420 435 385 435" 
        fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#evac-arrow)"/>

  <!-- Route 4: Manchester/Liverpool to North Wales & Lake District -->
  <path d="M 455 345 C 430 330 420 300 425 270" 
        fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#evac-arrow)"/>
  <text x="380" y="295" font-size="8" font-weight="800" fill="#1e3a8a">To Lake District</text>

  <!-- Route 5: Newcastle/Gateshead to Rural North & Yorkshire Dales -->
  <path d="M 490 245 C 495 260 505 270 515 280" 
        fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#evac-arrow)"/>

  <!-- Map Header Box -->
  <g transform="translate(45, 45)">
    <rect width="370" height="85" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.08))"/>
    <rect x="0" y="0" width="6" height="85" rx="3" fill="#1e3a8a"/>
    <text x="18" y="24" font-family="'Cinzel', Georgia, serif" font-size="14.5" font-weight="800" fill="#0f172a" letter-spacing="1">OPERATION PIED PIPER (1939)</text>
    <text x="18" y="42" font-size="10.5" font-weight="700" fill="#b45309">Official Evacuation Zones &amp; Reception Corridors</text>
    <text x="18" y="60" font-size="8.5" font-weight="500" fill="#475569">Ministry of Health Scheme • 1.5 Million Children &amp; Mothers Relocated</text>
    <text x="18" y="74" font-size="8" font-weight="600" fill="#0284c7">3-Day Mobilisation: 1–3 September 1939</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(45, 545)">
    <rect width="260" height="155" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="15" y="22" font-size="10" font-weight="800" fill="#0f172a" text-transform="uppercase" letter-spacing="1">Ministry Scheme Key</text>
    <line x1="15" y1="28" x2="245" y2="28" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Evacuation Area -->
    <rect x="18" y="38" width="18" height="14" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="44" y="49" font-size="8.8" font-weight="700" fill="#991b1b">Evacuation Danger Zones (Cities)</text>

    <!-- Reception Area -->
    <rect x="18" y="62" width="18" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="44" y="73" font-size="8.8" font-weight="700" fill="#166534">Reception Areas (Rural Havens)</text>

    <!-- Neutral Area -->
    <rect x="18" y="86" width="18" height="14" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="44" y="97" font-size="8.8" font-weight="700" fill="#92400e">Neutral Areas (Commuter Belts)</text>

    <!-- Evacuation Train Lines -->
    <line x1="18" y1="120" x2="38" y2="120" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="6,3"/>
    <polygon points="38,120 33,117 33,123" fill="#1e3a8a"/>
    <text x="44" y="123" font-size="8.5" font-weight="700" fill="#1e3a8a">Major Railway Evacuation Lines</text>

    <text x="18" y="144" font-size="7.5" font-weight="600" fill="#64748b" font-style="italic">Source: Ministry of Health Records (1939)</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(900, 95)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="0,-24 5,-5 24,0 5,5 0,24 -5,5 -24,0 -5,-5" fill="#cbd5e1"/>
    <polygon points="0,-24 0,0 5,-5" fill="#1e3a8a"/>
    <polygon points="0,24 0,0 -5,5" fill="#475569"/>
    <polygon points="24,0 0,0 5,5" fill="#475569"/>
    <polygon points="-24,0 0,0 -5,-5" fill="#475569"/>
    <text x="0" y="-28" font-size="9" font-weight="900" fill="#1e3a8a" text-anchor="middle">N</text>
  </g>

  <!-- Reprographic Stamp -->
  <text x="965" y="715" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="end">The History Revision Hub • Cartographic Archive (Ref: TNA HMSO 1939)</text>
</svg>
