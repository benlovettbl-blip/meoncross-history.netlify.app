<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="background:#fdfbf7; font-family:'Outfit', Arial, sans-serif;">
  <defs>
    <!-- Paper texture & filters -->
    <filter id="paper-warmth" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.98  0 1 0 0 0.96  0 0 1 0 0.91  0 0 0 0.04 0"/>
      <feComposite in2="SourceGraphic" in="gl" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#b91c1c"/>
    </marker>
    <marker id="sea-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a"/>
    </marker>
  </defs>

  <!-- Outer Parchment Border -->
  <rect x="15" y="15" width="970" height="670" rx="8" fill="#fcf9f2" stroke="#475569" stroke-width="2"/>
  <rect x="23" y="23" width="954" height="654" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Water bodies -->
  <!-- North Sea -->
  <path d="M 240 25 L 530 25 L 530 180 L 480 240 L 400 270 L 360 320 L 310 325 L 295 285 L 255 245 L 235 170 Z" fill="#e0f2fe" opacity="0.6"/>
  <!-- English Channel -->
  <path d="M 120 420 L 350 420 L 380 460 L 320 480 L 120 480 Z" fill="#e0f2fe" opacity="0.5"/>

  <!-- Landmass Outlines (Simplified Authentic Geopolitical 1938) -->
  <!-- Great Britain -->
  <path d="M 140 60 C 170 80 180 120 170 170 C 160 210 220 220 245 250 C 255 270 290 280 280 320 C 270 340 285 365 260 380 C 230 395 190 390 150 410 C 120 415 100 390 125 360 C 135 340 120 310 145 280 C 150 250 130 210 140 170 C 150 130 120 90 140 60 Z" 
        fill="#f1f5f9" stroke="#334155" stroke-width="2"/>

  <!-- Continental Europe (France, Low Countries, Germany, Czechoslovakia, Austria) -->
  <!-- France & Low Countries -->
  <path d="M 280 430 L 370 370 L 385 320 L 415 310 L 435 255 L 475 250 L 515 220 L 535 240 L 490 290 L 470 370 L 440 450 L 340 540 L 250 520 Z" 
        fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>

  <!-- Germany (1938 Reich boundaries) -->
  <path d="M 480 245 L 530 220 L 610 180 L 730 170 L 780 210 L 820 230 L 810 290 L 780 320 L 750 340 L 720 340 L 680 370 L 640 420 L 590 440 L 530 450 L 470 370 L 490 290 L 535 240 Z" 
        fill="#fef3c7" stroke="#b45309" stroke-width="2" opacity="0.65"/>

  <!-- Austria (Annexed March 1938) -->
  <path d="M 590 440 L 680 420 L 760 440 L 820 450 L 830 500 L 740 520 L 640 520 L 580 490 Z" 
        fill="#fef9c3" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,2"/>

  <!-- Czechoslovakia -->
  <path d="M 720 340 L 780 320 L 860 330 L 920 360 L 890 410 L 820 400 L 750 390 L 730 360 Z" 
        fill="#ecfdf5" stroke="#059669" stroke-width="2"/>

  <!-- International Borders (Dotted) -->
  <path d="M 435 255 L 450 320 L 470 370" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/> <!-- Netherlands/Germany -->
  <path d="M 370 370 L 470 370" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/> <!-- Belgium/Germany -->

  <!-- Country Labels -->
  <text x="180" y="240" font-size="16" font-weight="800" fill="#1e293b" letter-spacing="2">GREAT BRITAIN</text>
  <text x="610" y="270" font-size="18" font-weight="800" fill="#92400e" letter-spacing="3">GERMANY</text>
  <text x="765" y="375" font-size="13" font-weight="700" fill="#065f46" letter-spacing="1">CZECHOSLOVAKIA</text>
  <text x="670" y="480" font-size="14" font-weight="700" fill="#b45309" letter-spacing="2">AUSTRIA</text>
  <text x="320" y="480" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">FRANCE</text>
  <text x="420" y="280" font-size="10" font-weight="700" fill="#0369a1">NETHERLANDS</text>
  <text x="360" y="340" font-size="10" font-weight="700" fill="#475569">BELGIUM</text>
  <text x="340" y="150" font-size="15" font-weight="700" fill="#0284c7" font-style="italic" letter-spacing="2">NORTH SEA</text>
  <text x="160" y="445" font-size="11" font-weight="600" fill="#0284c7" font-style="italic">English Channel</text>

  <!-- RAILWAY RESCUE CORRIDORS (Authentic Distinct Paths) -->
  
  <!-- 1. PRAGUE ROUTE (Nicholas Winton / Trevor Chadwick Trains) -->
  <!-- Prague -> Nuremberg -> Frankfurt -> Cologne -> Bentheim (Border) -->
  <path d="M 760 360 L 660 380 L 580 375 L 530 350 L 480 270" 
        fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="8,4"/>
  
  <!-- 2. VIENNA ROUTE -->
  <!-- Vienna -> Linz -> Nuremberg -> Cologne -> Bentheim -->
  <path d="M 790 460 L 710 450 L 660 380" 
        fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- 3. BERLIN ROUTE -->
  <!-- Berlin -> Hannover -> Bentheim -->
  <path d="M 710 230 L 610 245 L 480 270" 
        fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- 4. DUTCH TRANSIT ROUTE -->
  <!-- Bentheim -> Hook of Holland -->
  <path d="M 480 270 L 425 285 L 400 305" 
        fill="none" stroke="#16a34a" stroke-width="3.5"/>

  <!-- 5. NORTH SEA FERRY CROSSING -->
  <!-- Hook of Holland -> Harwich Port -->
  <path d="M 400 305 C 340 310 290 315 260 330" 
        fill="none" stroke="#2563eb" stroke-width="3.5" stroke-dasharray="7,4" marker-end="url(#sea-arrow)"/>

  <!-- 6. FINAL BOAT-TRAIN TO LONDON -->
  <!-- Harwich -> London Liverpool Street -->
  <path d="M 260 330 L 215 365" 
        fill="none" stroke="#dc2626" stroke-width="4"/>

  <!-- KEY CITIES & HUBS (True Coordinates & Clean Badges) -->

  <!-- Prague -->
  <circle cx="760" cy="360" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <rect x="740" y="328" width="80" height="22" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="780" y="343" font-size="10.5" font-weight="800" fill="#991b1b" text-anchor="middle">PRAGUE</text>
  <text x="780" y="322" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">Winton Trains (669 Saved)</text>

  <!-- Vienna -->
  <circle cx="790" cy="460" r="5.5" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
  <rect x="780" y="470" width="70" height="18" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="815" y="483" font-size="9.5" font-weight="800" fill="#b45309" text-anchor="middle">VIENNA</text>

  <!-- Berlin -->
  <circle cx="710" cy="230" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <rect x="685" y="198" width="65" height="18" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="717" y="211" font-size="9.5" font-weight="800" fill="#92400e" text-anchor="middle">BERLIN</text>

  <!-- Key Transit Cities in Germany -->
  <!-- Nuremberg -->
  <circle cx="660" cy="380" r="3.5" fill="#475569"/>
  <text x="660" y="398" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Nuremberg</text>

  <!-- Frankfurt -->
  <circle cx="580" cy="375" r="3.5" fill="#475569"/>
  <text x="580" y="365" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Frankfurt</text>

  <!-- Cologne -->
  <circle cx="530" cy="350" r="3.5" fill="#475569"/>
  <text x="530" y="340" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Cologne</text>

  <!-- Bentheim (The Border Crossing) -->
  <circle cx="480" cy="270" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="450" y="242" width="85" height="18" rx="3" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.2"/>
  <text x="492" y="255" font-size="8.5" font-weight="800" fill="#065f46" text-anchor="middle">Bentheim Border</text>

  <!-- Hook of Holland -->
  <circle cx="400" cy="305" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8"/>
  <rect x="340" y="280" width="105" height="18" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="392" y="293" font-size="8.5" font-weight="800" fill="#1e40af" text-anchor="middle">Hook of Holland Ferry</text>

  <!-- Harwich Port -->
  <circle cx="260" cy="330" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8"/>
  <rect x="235" y="302" width="60" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="265" y="315" font-size="8.5" font-weight="800" fill="#1e40af" text-anchor="middle">Harwich</text>
  <text x="265" y="348" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">(Dovercourt Camp)</text>

  <!-- London Liverpool Street Station -->
  <circle cx="215" cy="365" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="135" y="360" width="75" height="32" rx="4" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
  <text x="172" y="375" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">LONDON</text>
  <text x="172" y="387" font-size="7.5" font-weight="700" fill="#fde047" text-anchor="middle">Liverpool St Stn</text>

  <!-- Map Header Box -->
  <g transform="translate(45, 45)">
    <rect width="360" height="75" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.08))"/>
    <rect x="0" y="0" width="6" height="75" rx="3" fill="#1e3a8a"/>
    <text x="18" y="24" font-family="'Cinzel', Georgia, serif" font-size="14.5" font-weight="800" fill="#0f172a" letter-spacing="1">THE KINDERTRANSPORT</text>
    <text x="18" y="42" font-size="10.5" font-weight="700" fill="#b45309" letter-spacing="0.5">Authentic Rescue Routes to Safety (1938–1939)</text>
    <text x="18" y="60" font-size="8.5" font-weight="500" fill="#64748b">Verified Historical Rail &amp; Ferry Corridors • ~10,000 Children Rescued</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(910, 85)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="0,-26 6,-6 26,0 6,6 0,26 -6,6 -26,0 -6,-6" fill="#cbd5e1"/>
    <polygon points="0,-26 0,0 6,-6" fill="#1e3a8a"/>
    <polygon points="0,26 0,0 -6,6" fill="#475569"/>
    <polygon points="26,0 0,0 6,6" fill="#475569"/>
    <polygon points="-26,0 0,0 -6,-6" fill="#475569"/>
    <text x="0" y="-30" font-size="10" font-weight="900" fill="#1e3a8a" text-anchor="middle">N</text>
  </g>

  <!-- Historical Legend -->
  <g transform="translate(45, 530)">
    <rect width="380" height="120" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="15" y="20" font-size="10" font-weight="800" fill="#0f172a" text-transform="uppercase" letter-spacing="1">Historical Map Key</text>
    <line x1="15" y1="26" x2="365" y2="26" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Item 1: Rail departure lines -->
    <line x1="20" y1="42" x2="60" y2="42" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,3"/>
    <circle cx="40" cy="42" r="3.5" fill="#dc2626"/>
    <text x="70" y="45" font-size="8.8" font-weight="700" fill="#1e293b">Continental Railway Corridors (Prague, Vienna, Berlin)</text>

    <!-- Item 2: Dutch safe corridor -->
    <line x1="20" y1="62" x2="60" y2="62" stroke="#16a34a" stroke-width="3"/>
    <text x="70" y="65" font-size="8.8" font-weight="700" fill="#166534">Dutch Neutral Transit (Bentheim to Hook of Holland)</text>

    <!-- Item 3: North Sea Ferry -->
    <line x1="20" y1="82" x2="60" y2="82" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="70" y="85" font-size="8.8" font-weight="700" fill="#1e40af">North Sea Overnight Passenger Ferry (Hook to Harwich)</text>

    <!-- Item 4: British Boat Train -->
    <line x1="20" y1="102" x2="60" y2="102" stroke="#dc2626" stroke-width="4"/>
    <circle cx="40" cy="102" r="4" fill="#1e293b"/>
    <text x="70" y="105" font-size="8.8" font-weight="700" fill="#0f172a">Boat-Train Arrival at London Liverpool Street Station</text>
  </g>

  <!-- Reprographic Stamp -->
  <text x="965" y="665" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="end">The History Revision Hub • Cartographic Archive (Ref: HET / USHMM 1938–39)</text>
</svg>
