    :root {
      --bg-dark: #07090e;
      --bg-card: #0f131f;
      --bg-card-hover: #161c2e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #f97316;
      --primary-glow: rgba(249, 115, 22, 0.35);
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --accent-yellow: #eab308;
      --border-glass: rgba(255, 255, 255, 0.1);
      --border-radius: 16px;
      --shadow-card: 0 14px 28px rgba(0, 0, 0, 0.6), 0 10px 10px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px;
      background-image: 
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }

    .app-container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, rgba(15, 19, 31, 0.95), rgba(22, 28, 46, 0.9));
      border: 1px solid var(--border-glass);
      border-radius: var(--border-radius);
      padding: 24px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      margin-bottom: 28px;
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-badge {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ea580c, #f97316);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .header-title h1 {
      font-family: 'Bangers', cursive;
      letter-spacing: 1.5px;
      font-size: 2.2rem;
      color: #facc15;
      text-shadow: 2px 2px 0px #000, 0 0 15px rgba(250, 204, 21, 0.4);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .header-title p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border-color: var(--border-glass);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    /* Filter Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
      background: rgba(15, 19, 31, 0.6);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-glass);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: rgba(249, 115, 22, 0.15);
      border-color: var(--primary);
      color: #f97316;
    }

    .search-box {
      position: relative;
      min-width: 260px;
    }

    .search-box input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 8px 14px 8px 36px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    /* 3D Flip Card Container */
    .card-scene {
      perspective: 1200px;
      height: 480px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .card-scene.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 2px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
    }

    /* Card Front */
    .card-front {
      background: #111422;
      position: relative;
    }

    .card-front-img {
      width: 100%;
      height: 62%;
      object-fit: cover;
      object-position: center 10%;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .card-scene:hover .card-front-img {
      transform: scale(1.03);
    }

    .card-front-top-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      color: #facc15;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .card-front-subtopic-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(249, 115, 22, 0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .card-front-body {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, #161b2e 0%, #0d111d 100%);
    }

    .card-satirical-title {
      font-family: 'Bangers', cursive;
      font-size: 1.6rem;
      letter-spacing: 1px;
      color: #facc15;
      text-shadow: 2px 2px 0 #000;
      line-height: 1.1;
      margin-bottom: 3px;
    }

    .card-phrase {
      font-size: 0.85rem;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-flip-prompt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }

    .card-flip-prompt i {
      color: var(--primary);
      animation: spinSlow 4s linear infinite;
    }

    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Card Back */
    .card-back {
      background: linear-gradient(180deg, #182035 0%, #0c101c 100%);
      transform: rotateY(180deg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid rgba(249, 115, 22, 0.4);
    }

    .card-back-header {
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .real-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 3px;
    }

    .real-subtitle {
      font-size: 0.82rem;
      color: var(--primary);
      font-weight: 600;
    }

    .card-bio {
      font-size: 0.85rem;
      color: #d1d5db;
      line-height: 1.45;
      margin-bottom: 14px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-cyan);
    }

    /* Stats Grid */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .stat-label {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-val {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
    }

    .stat-bar-track {
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-back-footer {
      border-top: 1px solid var(--border-glass);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Holographic shine effect */
    .hologram-shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.08) 45%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0.08) 55%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: translateX(-100%);
      transition: transform 0.6s ease;
      pointer-events: none;
    }

    .card-scene:hover .hologram-shine {
      transform: translateX(100%);
    }

    /* Print Stylesheet for Real Top Trumps Cards */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
      }
      header, .toolbar, .btn {
        display: none !important;
      }
      .cards-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
        page-break-inside: avoid;
      }
      .card-scene {
        height: 380px !important;
        page-break-inside: avoid;
        margin-bottom: 20px;
      }
      .card-inner {
        transform: none !important;
      }
      .card-face {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        color: #000 !important;
        background: #fff !important;
      }
      .card-front {
        position: relative !important;
      }
      .card-satirical-title {
        color: #000 !important;
        text-shadow: none !important;
      }
    }
  </style>
</head>

    "frontPhrase": "The Flag-Waving Fighter",
    "subtopicId": "subtopic_4_2",
    "image": "assets/card_hardhat.png",
    "description": "A 1970s construction worker wearing a hard hat, waving a giant American flag proudly.",
    "unlockMessage": "Unlock by achieving 100% Mastery in Topic 4.2",
    "bio": "The 'Hard Hat' workers fiercely supported Nixon's war efforts, culminating in the 1970 Hard Hat Riot where they clashed with anti-war protesters.",
    "stats": {
      "audacity": 85,
      "diplomaticSneakiness": 20,
      "rhetoricalPower": 60,
      "legacyScore": 70
    }
  },
  {
    "id": "card_kissinger",
    "name": "Kissinger the Messenger",
    "frontPhrase": "The Secret Negotiator",
    "subtopicId": "subtopic_4_3",
    "image": "assets/card_kissinger.png",
    "description": "Scheming in the shadows of Paris, holding a peace prize in one hand and a secret map in the other.",
    "unlockMessage": "Unlock by achieving 100% Mastery in Topic 4.3",
    "bio": "Henry Kissinger, National Security Advisor, conducted the secret back-channel negotiations that ultimately led to the Paris Peace Accords.",
    "stats": {
      "audacity": 80,
      "diplomaticSneakiness": 100,
      "rhetoricalPower": 85,
      "legacyScore": 80
    }
  },
  {
    "id": "card_ho_chi_minh",
    "name": "Ho Chi Win",
    "frontPhrase": "The Unyielding Spirit",
    "subtopicId": "subtopic_4_4",
    "image": "assets/card_ho_chi_minh.png",
    "description": "The enduring spiritual leader of North Vietnam, calmly sipping tea while the Ho Chi Minh trail hums in the background.",
    "unlockMessage": "Unlock by achieving 100% Mastery in Topic 4.4",
    "bio": "Ho Chi Minh was the revolutionary founder of the Viet Minh. His unyielding determination inspired the North Vietnamese to outlast the USA.",
    "stats": {
      "audacity": 100,
      "diplomaticSneakiness": 100,
      "rhetoricalPower": 100,
      "legacyScore": 100
    }
  }
];

    // Audio synthesizer for click/card-flip
    const audioCtx = (typeof window.AudioContext !== 'undefined' || typeof window.webkitAudioContext !== 'undefined')
      ? new (window.AudioContext || window.webkitAudioContext)()
      : null;

    function playFlipSound() {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e) {}
    }

    function renderCards(filter = 'all', query = '') {
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      const filtered = CARDS.filter(card => {
        const isCivilRights = card.subtopicId.startsWith('subtopic_1') || card.subtopicId.startsWith('subtopic_2');
        const isVietnam = card.subtopicId.startsWith('subtopic_3') || card.subtopicId.startsWith('subtopic_4');
        
        let matchesFilter = true;
        if (filter === 'civil_rights') matchesFilter = isCivilRights;
        if (filter === 'vietnam') matchesFilter = isVietnam;

        let matchesQuery = true;
        if (query) {
          const q = query.toLowerCase();
          matchesQuery = card.name.toLowerCase().includes(q) || 
                         card.frontPhrase.toLowerCase().includes(q) || 
                         card.bio.toLowerCase().includes(q) ||
                         card.subtopicId.toLowerCase().includes(q);
        }

        return matchesFilter && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No historical figures found matching your search.</div>';
        return;
      }

      filtered.forEach(card => {
        const isCR = card.subtopicId.startsWith('subtopic_1') || card.subtopicId.startsWith('subtopic_2');
        const categoryBadge = isCR ? 'Civil Rights' : 'Vietnam War';
        const topicNum = card.subtopicId.replace('subtopic_', 'KT ');

        const cardScene = document.createElement('div');
        cardScene.className = 'card-scene';
        cardScene.dataset.id = card.id;

        const audacity = card.stats ? card.stats.audacity : 75;
        const sneakiness = card.stats ? card.stats.diplomaticSneakiness : 60;
        const military = card.stats ? (card.stats.militaryMight || card.stats.rhetoricalPower || 80) : 80;
        const legacy = card.stats ? card.stats.legacyScore : 85;
        const militaryLabel = isCR ? 'Rhetorical Power' : 'Military Might';

        cardScene.innerHTML = `
          <div class="card-inner">
            <!-- FRONT -->
            <div class="card-face card-front">
              <span class="card-front-top-badge">${categoryBadge}</span>
              <span class="card-front-subtopic-badge">${topicNum}</span>
              <img src="${card.image}" alt="${card.name}" class="card-front-img" onerror="this.src='/units/usa/assets/card_marshall.png'">
              <div class="card-front-body">
                <div>
                  <h3 class="card-satirical-title">${card.name}</h3>
                  <div class="card-phrase">"${card.frontPhrase}"</div>
                </div>
                <div class="card-flip-prompt">
                  <span>Click card to reveal stats</span>
                  <i class="fa-solid fa-arrows-rotate"></i>
                </div>
              </div>
              <div class="hologram-shine"></div>
            </div>

            <!-- BACK -->
            <div class="card-face card-back">
              <div>
                <div class="card-back-header">
                  <div class="real-name">${card.name}</div>
                  <div class="real-subtitle">${card.frontPhrase} • ${topicNum}</div>
                </div>
                <div class="card-bio">${card.bio}</div>
              </div>

              <!-- Top Trumps Stats -->
              <div class="stats-container">
                <div class="stat-row">
                  <div class="stat-meta">
                    <span class="stat-label"><i class="fa-solid fa-bolt" style="color: #f97316;"></i> Audacity</span>
                    <span class="stat-val" style="color: #f97316;">${audacity}</span>
                  </div>
                  <div class="stat-bar-track">
                    <div class="stat-bar-fill" style="width: ${audacity}%; background: linear-gradient(90deg, #ea580c, #f97316);"></div>
                  </div>
                </div>

                <div class="stat-row">
                  <div class="stat-meta">
                    <span class="stat-label"><i class="fa-solid fa-user-ninja" style="color: #a855f7;"></i> Sneakiness / Strategy</span>
                    <span class="stat-val" style="color: #a855f7;">${sneakiness}</span>
                  </div>
                  <div class="stat-bar-track">
                    <div class="stat-bar-fill" style="width: ${sneakiness}%; background: linear-gradient(90deg, #7e22ce, #a855f7);"></div>
                  </div>
                </div>

                <div class="stat-row">
                  <div class="stat-meta">
                    <span class="stat-label"><i class="fa-solid fa-shield-halved" style="color: #06b6d4;"></i> ${militaryLabel}</span>
                    <span class="stat-val" style="color: #06b6d4;">${military}</span>
                  </div>
                  <div class="stat-bar-track">
                    <div class="stat-bar-fill" style="width: ${military}%; background: linear-gradient(90deg, #0891b2, #06b6d4);"></div>
                  </div>
                </div>

                <div class="stat-row">
                  <div class="stat-meta">
                    <span class="stat-label"><i class="fa-solid fa-crown" style="color: #10b981;"></i> Legacy Score</span>
                    <span class="stat-val" style="color: #10b981;">${legacy}</span>
                  </div>
                  <div class="stat-bar-track">
                    <div class="stat-bar-fill" style="width: ${legacy}%; background: linear-gradient(90deg, #059669, #10b981);"></div>
                  </div>
                </div>
              </div>

              <div class="card-back-footer">
                <span>Edexcel GCSE History</span>
                <span>Click to Flip <i class="fa-solid fa-rotate-left"></i></span>
              </div>
            </div>
          </div>
        `;

        cardScene.addEventListener('click', () => {
          playFlipSound();
          cardScene.classList.toggle('flipped');
        });

        grid.appendChild(cardScene);
      });
    }

    // Filter and search handling
    let currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderCards(currentFilter, document.getElementById('search-input').value);
      });
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      renderCards(currentFilter, e.target.value);
    });

    let allFlipped = false;
    document.getElementById('unlock-all-btn').addEventListener('click', () => {
      allFlipped = !allFlipped;
      playFlipSound();
      document.querySelectorAll('.card-scene').forEach(card => {
        if (allFlipped) {
          card.classList.add('flipped');
        } else {
          card.classList.remove('flipped');
        }
      });
      document.getElementById('unlock-all-btn').innerHTML = allFlipped
        ? '<i class="fa-solid fa-image"></i> View Artwork (Front)'
        : '<i class="fa-solid fa-unlock"></i> Flip All Cards';
    });

    // Initial render
    renderCards();
  </script>
</body>
</html>
