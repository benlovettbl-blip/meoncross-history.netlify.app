<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Fleet Convict Database</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e293b;
      --secondary: #334155;
      --accent: #0284c7;
      --background: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #334155;
    }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--text);
    }
    .header {
      background: var(--primary);
      color: white;
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 4px solid var(--accent);
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
    }
    .header p {
      margin: 0;
      color: #94a3b8;
      font-size: 1.1rem;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .search-panel {
      background: var(--surface);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      margin-bottom: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .input-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--secondary);
    }
    .input-group input, .input-group select {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input:focus, .input-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-weight: 500;
      color: var(--secondary);
    }
    .table-container {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--primary);
      color: white;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    th i {
      margin-right: 0.5rem;
    }
    tr:hover {
      background-color: #f1f5f9;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #e0f2fe;
      color: #0369a1;
    }
    .badge.female {
      background: #fce7f3;
      color: #be185d;
    }
    .loader {
      text-align: center;
      padding: 3rem;
      color: var(--accent);
      font-size: 2rem;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--secondary);
    }
    .empty-state i {
      font-size: 3rem;
      color: #cbd5e1;
      margin-bottom: 1rem;
    }
    
    .notes-tooltip {
      position: relative;
      cursor: help;
      color: var(--accent);
    }
    .notes-tooltip:hover::after {
      content: attr(data-notes);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      width: max-content;
      max-width: 300px;
      white-space: pre-wrap;
      z-index: 20;
      margin-bottom: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fa-solid fa-ship"></i> First Fleet Convict Database</h1>
    <p>Search through the historical records of the 780 convicts transported to Australia in 1788.</p>
  </div>

  <div class="container">
    <div class="search-panel">
      <div class="input-group">
        <label for="searchName"><i class="fa-solid fa-magnifying-glass"></i> Search Name</label>
        <input type="text" id="searchName" placeholder="e.g. John, Smith...">
      </div>
      <div class="input-group">
        <label for="searchCrime"><i class="fa-solid fa-scale-balanced"></i> Search Crime</label>
        <input type="text" id="searchCrime" placeholder="e.g. stealing, highway robbery...">
      </div>
      <div class="input-group">
        <label for="searchTrade"><i class="fa-solid fa-hammer"></i> Trade / Occupation</label>
        <input type="text" id="searchTrade" placeholder="e.g. labourer, servant...">
      </div>
      <div class="input-group">
        <label for="filterSex"><i class="fa-solid fa-venus-mars"></i> Sex</label>
        <select id="filterSex">
          <option value="">All</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>
    </div>

    <div class="stats-bar">
      <span id="resultsCount">Loading convicts...</span>
      <span>Data source: University of Wollongong First Fleet Database</span>
    </div>

    <div class="table-container">
      <table id="convictsTable">
        <thead>
          <tr>
            <th><i class="fa-solid fa-user"></i> Name</th>
            <th><i class="fa-solid fa-venus-mars"></i> Sex</th>
            <th><i class="fa-solid fa-cake-candles"></i> Age</th>
            <th><i class="fa-solid fa-scale-balanced"></i> Crime</th>
            <th><i class="fa-solid fa-hammer"></i> Trade</th>
            <th><i class="fa-solid fa-gavel"></i> Tried At</th>
            <th><i class="fa-solid fa-ship"></i> Ship</th>
            <th><i class="fa-solid fa-note-sticky"></i> Notes</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8" class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let convictsData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/data/first_fleet.json');
        convictsData = await response.json();
        renderTable(convictsData);
        
        // Setup event listeners
        document.getElementById('searchName').addEventListener('input', debounce(filterData, 300));
        document.getElementById('searchCrime').addEventListener('input', debounce(filterData, 300));
        document.getElementById('searchTrade').addEventListener('input', debounce(filterData, 300));
        document.getElementById('filterSex').addEventListener('change', filterData);
        
      } catch (error) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><br>Failed to load database.</td></tr>`;
      }
    });

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    function filterData() {
      const name = document.getElementById('searchName').value.toLowerCase();
      const crime = document.getElementById('searchCrime').value.toLowerCase();
      const trade = document.getElementById('searchTrade').value.toLowerCase();
      const sex = document.getElementById('filterSex').value;

      const filtered = convictsData.filter(c => {
        const fullName = `${c.firstName} ${c.lastName}`.toLowerCase();
        
        if (name && !fullName.includes(name)) return false;
        if (crime && !c.crime.toLowerCase().includes(crime)) return false;
        if (trade && !c.trade.toLowerCase().includes(trade)) return false;
        if (sex && c.sex !== sex) return false;
        
        return true;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const count = document.getElementById('resultsCount');
      
      count.innerHTML = `Showing <strong>${data.length}</strong> convict${data.length !== 1 ? 's' : ''}`;
      
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fa-solid fa-ghost"></i><br>No convicts found matching your search.</td></tr>`;
        return;
      }

      // Limit to 100 to prevent browser freeze on big searches
      const displayData = data.slice(0, 100);
      let html = '';

      displayData.forEach(c => {
        const sexClass = c.sex === 'F' ? 'female' : '';
        const notesHtml = c.notes ? `<span class="notes-tooltip" data-notes="${c.notes.replace(/"/g, '&quot;')}"><i class="fa-solid fa-circle-info"></i> View</span>` : '<span style="color:#cbd5e1">-</span>';
        
        html += `
          <tr>
            <td style="font-weight: 500;">${c.lastName ? c.lastName.toUpperCase() : ''}, ${c.firstName}</td>
            <td><span class="badge ${sexClass}">${c.sex === 'F' ? 'Female' : (c.sex === 'M' ? 'Male' : '?')}</span></td>
            <td>${c.age}</td>
            <td>${c.crime || '-'}</td>
            <td>${c.trade || '-'}</td>
            <td>${c.whereTried || '-'}</td>
            <td>${c.ship || '-'}</td>
            <td style="text-align:center;">${notesHtml}</td>
          </tr>
        `;
      });

      if (data.length > 100) {
        html += `<tr><td colspan="8" style="text-align: center; color: var(--secondary); font-style: italic;">...and ${data.length - 100} more. Refine your search to see them.</td></tr>`;
      }

      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
