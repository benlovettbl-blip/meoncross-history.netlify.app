<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Map drop shadows & filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>

    <!-- Hatch patterns for built-up refugee camp areas -->
    <pattern id="campHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="sabraHatch" width="8" height="8" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ea580c" stroke-width="1.2" stroke-opacity="0.2"/>
    </pattern>
    <pattern id="parkHatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#15803d" fill-opacity="0.3"/>
      <circle cx="7" cy="7" r="1.5" fill="#15803d" fill-opacity="0.3"/>
    </pattern>

    <!-- Arrow markers -->
    <marker id="arrow-phalangist" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-idf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Background Base Map Grid -->
  <rect width="900" height="800" fill="#f8fafc"/>
  
  <!-- Map Title Banner / Archival Header -->
  <rect x="0" y="0" width="900" height="68" fill="#0f172a"/>
  <text x="24" y="28" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.5">TOPOGRAPHICAL SITE PLAN: SABRA &amp; SHATILA SECTOR</text>
  <text x="24" y="48" font-size="12" font-weight="500" fill="#94a3b8">WEST BEIRUT • INVESTIGATIVE SITE MAP ENTERED INTO EVIDENCE BY THE KAHAN COMMISSION (16–18 SEPT 1982)</text>
  <rect x="760" y="16" width="116" height="34" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="818" y="38" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">EXHIBIT K-42</text>

  <!-- District Backgrounds -->
  <!-- Bir Hassan / West Sector -->
  <path d="M 50,68 L 320,68 L 300,740 L 50,740 Z" fill="#f1f5f9"/>
  <!-- Southern Suburbs Base -->
  <path d="M 320,68 L 850,68 L 850,740 L 300,740 Z" fill="#f8fafc"/>

  <!-- Horsh Beirut (Pine Forest) to the North-East -->
  <path d="M 640,90 C 700,90 780,120 840,160 L 840,240 C 760,210 680,190 620,180 Z" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <path d="M 640,90 C 700,90 780,120 840,160 L 840,240 C 760,210 680,190 620,180 Z" fill="url(#parkHatch)"/>
  <text x="730" y="150" font-size="11" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="1">HORSH BEIRUT</text>
  <text x="730" y="166" font-size="9.5" font-weight="500" fill="#15803d" text-anchor="middle">(PINE FOREST)</text>

  <!-- Camille Chamoun Sports City Stadium Complex (West) -->
  <g transform="translate(140, 260)" filter="url(#subtle-shadow)">
    <!-- Outer Stadium Oval -->
    <ellipse cx="65" cy="85" rx="65" ry="85" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Inner Stadium Field -->
    <ellipse cx="65" cy="85" rx="42" ry="58" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <text x="65" y="80" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle">CAMILLE CHAMOUN</text>
    <text x="65" y="94" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">SPORTS CITY STADIUM</text>
    <text x="65" y="108" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="middle">(Damaged / Staging Site)</text>
  </g>

  <!-- Major Road Networks -->
  <!-- Rue de l'Aéroport (Airport Highway - Western North-South Axis) -->
  <path d="M 110,68 L 110,740" stroke="#94a3b8" stroke-width="14" fill="none"/>
  <path d="M 110,68 L 110,740" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <text transform="translate(98, 480) rotate(-90)" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">AIRPORT HIGHWAY (RUE DE L'AÉROPORT)</text>

  <!-- Cité Sportive Avenue (East-West Boulevard) -->
  <path d="M 110,220 L 850,220" stroke="#94a3b8" stroke-width="10" fill="none"/>
  <text x="210" y="212" font-size="9" font-weight="700" fill="#475569">AVENUE DE LA CITÉ SPORTIVE</text>

  <!-- Old Sidon Road (Eastern Axis) -->
  <path d="M 680,68 L 650,420 L 610,740" stroke="#94a3b8" stroke-width="12" fill="none"/>
  <text transform="translate(640, 560) rotate(82)" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">OLD SIDON ROAD (ROUTE DE SAÏDA)</text>

  <!-- Rue Sabra (Central North-South Camp Spine) -->
  <path d="M 450,110 L 460,340 L 450,480 L 430,680" stroke="#cbd5e1" stroke-width="8" fill="none"/>
  <text transform="translate(470, 310) rotate(87)" font-size="9" font-weight="700" fill="#64748b">RUE SABRA (MAIN SPINE)</text>

  <!-- Minor connecting roads & alleys -->
  <path d="M 110,480 L 450,480 L 630,480" stroke="#e2e8f0" stroke-width="6" fill="none"/>
  <path d="M 280,340 L 660,340" stroke="#e2e8f0" stroke-width="5" fill="none"/>
  <path d="M 330,600 L 620,600" stroke="#e2e8f0" stroke-width="5" fill="none"/>
  <path d="M 320,130 L 680,130" stroke="#e2e8f0" stroke-width="5" fill="none"/>

  <!-- Kuwaiti Embassy Roundabout Complex (South-West) -->
  <g transform="translate(230, 540)">
    <circle cx="0" cy="0" r="28" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <!-- Embassy Building -->
    <rect x="-70" y="-20" width="38" height="40" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    <text x="-51" y="-26" font-size="9" font-weight="800" fill="#1e293b" text-anchor="middle">KUWAITI</text>
    <text x="-51" y="-14" font-size="9" font-weight="800" fill="#1e293b" text-anchor="middle">EMBASSY</text>
    <text x="36" y="5" font-size="8.5" font-weight="700" fill="#475569">Traffic Circle</text>
  </g>

  <!-- REFUGEE CAMP BOUNDARIES -->
  <!-- 1. Sabra Neighborhood (North - Dense Urban Area) -->
  <path d="M 370,120 L 580,120 L 590,320 L 360,320 Z" fill="#ffedd5" stroke="#f97316" stroke-width="2" stroke-dasharray="4 2" filter="url(#subtle-shadow)"/>
  <path d="M 370,120 L 580,120 L 590,320 L 360,320 Z" fill="url(#sabraHatch)"/>
  
  <!-- 2. Shatila Refugee Camp (South - Formal UNRWA Perimeter) -->
  <path d="M 350,330 L 590,330 L 580,570 L 340,570 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" filter="url(#subtle-shadow)"/>
  <path d="M 350,330 L 590,330 L 580,570 L 340,570 Z" fill="url(#campHatch)"/>

  <!-- Camp District Labels -->
  <rect x="400" y="180" width="150" height="38" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#ea580c" stroke-width="1"/>
  <text x="475" y="198" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle" letter-spacing="1">SABRA DISTRICT</text>
  <text x="475" y="211" font-size="9" font-weight="600" fill="#ea580c" text-anchor="middle">(Urban Refugee Quarter)</text>

  <rect x="390" y="410" width="170" height="46" rx="4" fill="#ffffff" fill-opacity="0.92" stroke="#dc2626" stroke-width="1.5" filter="url(#subtle-shadow)"/>
  <text x="475" y="430" font-size="13" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="1.5">SHATILA CAMP</text>
  <text x="475" y="446" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">UNRWA FORMAL PERIMETER</text>

  <!-- Medical Facilities -->
  <!-- Gaza Hospital (North edge of Sabra) -->
  <g transform="translate(480, 95)" filter="url(#subtle-shadow)">
    <rect x="-35" y="-12" width="70" height="24" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="0" y="4" font-size="9.5" font-weight="800" fill="#0369a1" text-anchor="middle">GAZA HOSP.</text>
    <circle cx="-25" cy="0" r="5" fill="#ef4444"/>
    <rect x="-27" y="-1" width="4" height="2" fill="#ffffff"/>
    <rect x="-26" y="-2" width="2" height="4" fill="#ffffff"/>
  </g>

  <!-- Akka Hospital (South of Shatila, near roundabout) -->
  <g transform="translate(360, 595)" filter="url(#subtle-shadow)">
    <rect x="-35" y="-12" width="70" height="24" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="0" y="4" font-size="9.5" font-weight="800" fill="#0369a1" text-anchor="middle">AKKA HOSP.</text>
    <circle cx="-25" cy="0" r="5" fill="#ef4444"/>
    <rect x="-27" y="-1" width="4" height="2" fill="#ffffff"/>
    <rect x="-26" y="-2" width="2" height="4" fill="#ffffff"/>
  </g>

  <!-- KEY MILITARY & INVESTIGATIVE FINDINGS (KAHAN COMMISSION) -->

  <!-- 1. IDF FORWARD COMMAND OBSERVATION POST (7-Story Rooftop) -->
  <!-- Position: ~200m Southwest of Shatila on 7-story building overlooking camp -->
  <g transform="translate(230, 480)">
    <!-- Visual Line of Sight Cone into Shatila -->
    <path d="M 0,0 L 130,-110 L 210,50 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
    
    <!-- Observation Post Icon -->
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#1e3a8a" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
    <polygon points="-8,-6 8,-6 5,8 -5,8" fill="#60a5fa"/>
    <circle cx="0" cy="1" r="3" fill="#ffffff"/>

    <!-- Annotation Box -->
    <rect x="-175" y="-65" width="165" height="52" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="-92" y="-48" font-size="10" font-weight="800" fill="#60a5fa" text-anchor="middle">IDF FORWARD COMMAND POST</text>
    <text x="-92" y="-35" font-size="8.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">7-Story Rooftop Observation</text>
    <text x="-92" y="-22" font-size="8" font-weight="500" fill="#94a3b8" text-anchor="middle">Direct Sightline into Shatila (~200m)</text>
    
    <!-- Sightline arrow label -->
    <text x="80" y="-20" font-size="8.5" font-weight="700" fill="#1d4ed8" transform="rotate(-25 80 -20)">Visual Sightline Cone</text>
  </g>

  <!-- 2. IDF PERIMETER CORDON & CHECKPOINTS (West Beirut Encirclement) -->
  <!-- The Cordon Line -->
  <path d="M 210,100 L 290,230 L 270,410 L 240,580 L 320,680 L 520,680" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M 640,100 L 620,230 L 610,410 L 600,680" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Checkpoint markers -->
  <g transform="translate(290, 230)">
    <circle cx="0" cy="0" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="3" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">CP</text>
  </g>
  <g transform="translate(260, 420)">
    <circle cx="0" cy="0" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="3" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">CP</text>
  </g>
  <g transform="translate(250, 620)">
    <circle cx="0" cy="0" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="3" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">CP</text>
  </g>
  <g transform="translate(420, 680)">
    <circle cx="0" cy="0" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="3" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">CP</text>
  </g>
  <g transform="translate(615, 340)">
    <circle cx="0" cy="0" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="3" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">CP</text>
  </g>

  <!-- 3. PHALANGIST MILITIA ENTRY AXES (16 September 1982, ~17:00) -->
  <!-- Primary entry from south (Beirut Airport staging area) into southern gate of Shatila -->
  <path d="M 440,730 L 440,650 L 450,575" fill="none" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrow-phalangist)"/>
  <rect x="450" y="650" width="180" height="28" rx="3" fill="#7f1d1d" stroke="#f87171" stroke-width="1" filter="url(#subtle-shadow)"/>
  <text x="540" y="668" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">PRIMARY PHALANGIST ENTRY</text>

  <!-- Secondary entry axis from East -->
  <path d="M 680,450 L 590,450" fill="none" stroke="#b91c1c" stroke-width="4.5" marker-end="url(#arrow-phalangist)"/>
  <rect x="635" y="415" width="150" height="26" rx="3" fill="#7f1d1d" stroke="#f87171" stroke-width="1"/>
  <text x="710" y="432" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">SECONDARY ENTRY AXIS</text>

  <!-- Illumination flares indicator over camp -->
  <g transform="translate(470, 360)">
    <circle cx="0" cy="0" r="50" fill="#fef08a" fill-opacity="0.25" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="0" y="-30" font-size="8" font-weight="700" fill="#854d0e" text-anchor="middle">IDF Mortar Flare Arc</text>
    <text x="0" y="-18" font-size="7.5" font-weight="600" fill="#a16207" text-anchor="middle">(Night Illumination)</text>
  </g>

  <!-- MAP COMPASS & SCALE -->
  <g transform="translate(80, 140)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    <polygon points="0,-16 5,-2 -5,-2" fill="#0f172a"/>
    <polygon points="0,16 5,2 -5,2" fill="#94a3b8"/>
    <text x="0" y="-20" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">N</text>
  </g>
  <g transform="translate(50, 715)">
    <rect x="0" y="0" width="140" height="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>
    <rect x="10" y="6" width="60" height="6" fill="#0f172a"/>
    <rect x="70" y="6" width="60" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="10" y="4" font-size="7.5" font-weight="700" fill="#334155">0</text>
    <text x="70" y="4" font-size="7.5" font-weight="700" fill="#334155">250m</text>
    <text x="130" y="4" font-size="7.5" font-weight="700" fill="#334155">500m</text>
  </g>

  <!-- MAP LEGEND (Bottom Right Floating Card) -->
  <g transform="translate(580, 520)" filter="url(#shadow)">
    <rect width="300" height="240" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="300" height="28" rx="6 6 0 0" fill="#1e293b"/>
    <text x="150" y="19" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">INVESTIGATIVE MAP LEGEND</text>

    <!-- Legend Items -->
    <!-- Shatila Camp -->
    <rect x="14" y="38" width="22" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="14" y1="38" x2="36" y2="52" stroke="#dc2626" stroke-width="1"/>
    <text x="46" y="50" font-size="9.5" font-weight="700" fill="#1e293b">Shatila Camp (UNRWA Perimeter)</text>

    <!-- Sabra District -->
    <rect x="14" y="60" width="22" height="14" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <line x1="14" y1="74" x2="36" y2="60" stroke="#ea580c" stroke-width="1"/>
    <text x="46" y="72" font-size="9.5" font-weight="700" fill="#1e293b">Sabra Urban Refugee District</text>

    <!-- IDF Command Post -->
    <rect x="16" y="83" width="18" height="18" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="25" cy="92" r="3" fill="#ffffff"/>
    <text x="46" y="96" font-size="9.5" font-weight="700" fill="#1e293b">IDF Forward Command Rooftop Post</text>

    <!-- Sightline Cone -->
    <polygon points="14,120 36,110 36,130" fill="#3b82f6" fill-opacity="0.3" stroke="#2563eb" stroke-width="1"/>
    <text x="46" y="123" font-size="9.5" font-weight="700" fill="#1e293b">Direct Visual Sighting Arc (~200m)</text>

    <!-- IDF Cordon -->
    <line x1="14" y1="144" x2="36" y2="144" stroke="#2563eb" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="25" cy="144" r="5" fill="#1d4ed8"/>
    <text x="46" y="148" font-size="9.5" font-weight="700" fill="#1e293b">IDF Perimeter Cordon &amp; Checkpoints</text>

    <!-- Phalangist Route -->
    <line x1="14" y1="170" x2="34" y2="170" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrow-phalangist)"/>
    <text x="46" y="174" font-size="9.5" font-weight="700" fill="#1e293b">Phalangist Militia Entry Routes (16 Sept)</text>

    <!-- Hospitals -->
    <rect x="18" y="192" width="14" height="14" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="25" cy="199" r="4" fill="#ef4444"/>
    <text x="46" y="203" font-size="9.5" font-weight="700" fill="#1e293b">Medical Facilities (Gaza &amp; Akka)</text>

    <!-- Footer Note -->
    <text x="150" y="228" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Evidence evaluated under Supreme Court Justice Y. Kahan</text>
  </g>
</svg>
