<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1180" width="850" height="1180">
  <defs>
    <!-- Paper texture & filters -->
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fffef8" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="60" elevation="50"/>
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
    </filter>
    
    <linearGradient id="flag-black" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="flag-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="flag-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    
    <pattern id="mimeo-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(71, 85, 105, 0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background Paper Plate -->
  <rect width="850" height="1180" fill="#fdfbf7"/>
  <rect width="850" height="1180" fill="url(#mimeo-grid)"/>

  <!-- Outer Aged Border -->
  <rect x="25" y="25" width="800" height="1130" fill="none" stroke="#78350f" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="32" y="32" width="786" height="1116" fill="none" stroke="#92400e" stroke-width="0.8" stroke-dasharray="4 2" stroke-opacity="0.5"/>

  <!-- Archival Accession Header Bar -->
  <rect x="40" y="42" width="770" height="32" fill="#fef3c7" rx="3" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="55" y="63" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#92400e" letter-spacing="1">PASSIA ARCHIVAL REPOSITORY • DOCUMENT ACCESSION: #UNLU-B10-1988 • HISTORICAL EXHIBIT</text>
  <text x="730" y="63" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#78350f">EAST JERUSALEM</text>

  <!-- Flag Color Top Ribbon -->
  <rect x="40" y="82" width="256" height="5" fill="#111827"/>
  <rect x="296" y="82" width="257" height="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <rect x="553" y="82" width="257" height="5" fill="#047857"/>

  <!-- Document Header / Calligraphy -->
  <g text-anchor="middle">
    <!-- Basmala -->
    <text x="425" y="125" font-family="'Traditional Arabic', 'Amiri', 'Georgia', serif" font-size="22" font-weight="bold" fill="#1e293b" letter-spacing="2">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
    
    <!-- Unified Leadership Heading -->
    <text x="425" y="162" font-family="'Traditional Arabic', 'Amiri', 'Georgia', serif" font-size="25" font-weight="bold" fill="#0f172a" letter-spacing="1.5">القيادة الوطنية الموحدة للانتفاضة في الأراضي المحتلة</text>
    <text x="425" y="185" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="13" font-weight="bold" fill="#0369a1" letter-spacing="3.5">UNIFIED NATIONAL LEADERSHIP OF THE UPRISING (UNLU)</text>
    
    <!-- Clandestine Leaflet Call -->
    <rect x="235" y="202" width="380" height="42" fill="#1e293b" rx="4"/>
    <text x="425" y="228" font-family="'Traditional Arabic', 'Amiri', 'Georgia', serif" font-size="21" font-weight="bold" fill="#f8fafc">نداء رقم ١٠ — نداء القدس</text>
    <text x="425" y="239" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#94a3b8" letter-spacing="2">COMMUNIQUÉ NO. 10 • "CALL OF JERUSALEM"</text>
  </g>

  <!-- Metadata Subhead (Date, Origin, Distribution Method) -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#475569">
    <text x="50" y="272"><strong>DATE:</strong> 15 Rajab 1408 AH / Mid-February 1988</text>
    <text x="50" y="290"><strong>ORIGIN:</strong> Underground Clandestine Committee (West Bank &amp; Gaza)</text>
    <text x="550" y="272"><strong>FORMAT:</strong> Mimeographed Handbill</text>
    <text x="550" y="290"><strong>DISTRIBUTION:</strong> Pre-dawn Clandestine Delivery</text>
  </g>
  <line x1="50" y1="305" x2="800" y2="305" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Preamble Block -->
  <rect x="50" y="320" width="750" height="85" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="70" y="342" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#0f284e" letter-spacing="1">AUTHENTIC DOCUMENT DECREE OVERVIEW (TRANSLATION)</text>
  <text x="70" y="365" font-family="'Georgia', serif" font-size="13" font-style="italic" fill="#334155" line-height="1.5">
    "To the masses of our heroic Palestinian people... The uprising continues, shaking the pillars of the occupation.
  </text>
  <text x="70" y="388" font-family="'Georgia', serif" font-size="13" font-style="italic" fill="#334155">
    Neither the brutal 'Iron Fist' nor the policy of breaking bones will halt our people's march toward freedom and sovereignty."
  </text>

  <!-- 4 Core Operational Strike Decrees (Structured Cards) -->
  <!-- Decree 1: General Strike -->
  <g transform="translate(50, 425)">
    <rect width="365" height="175" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" rx="5"/>
    <rect width="365" height="30" fill="#1e3a8a" rx="5 5 0 0"/>
    <text x="14" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">1. GENERAL COMMERCIAL STRIKE</text>
    <text x="350" y="20" font-family="'Traditional Arabic', serif" font-size="14" font-weight="bold" fill="#93c5fd" text-anchor="end">الإضراب التجاري الشامل</text>
    <text x="15" y="52" font-family="'Georgia', serif" font-size="12" font-weight="bold" fill="#0f172a">Universal Merchant &amp; Labor Shutdown:</text>
    <text x="15" y="72" font-family="'Georgia', serif" font-size="11.5" fill="#334155" width="335">
      <tspan x="15" dy="0">• Total closure of all stores, workshops, and transport</tspan>
      <tspan x="27" dy="18">on Tuesdays, Thursdays, and Sundays.</tspan>
      <tspan x="15" dy="20">• Food stores to open strictly between 9:00 AM –</tspan>
      <tspan x="27" dy="18">12:00 PM on permitted days only.</tspan>
      <tspan x="15" dy="20">• Defiance of IDF orders forcing shops to reopen.</tspan>
    </text>
  </g>

  <!-- Decree 2: Boycott & Tax Resistance -->
  <g transform="translate(435, 425)">
    <rect width="365" height="175" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" rx="5"/>
    <rect width="365" height="30" fill="#047857" rx="5 5 0 0"/>
    <text x="14" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">2. TAX REFUSAL &amp; ECONOMIC BOYCOTT</text>
    <text x="350" y="20" font-family="'Traditional Arabic', serif" font-size="14" font-weight="bold" fill="#a7f3d0" text-anchor="end">مقاطعة البضائع والضرائب</text>
    <text x="15" y="52" font-family="'Georgia', serif" font-size="12" font-weight="bold" fill="#0f172a">Severing Economic Dependencies:</text>
    <text x="15" y="72" font-family="'Georgia', serif" font-size="11.5" fill="#334155">
      <tspan x="15" dy="0">• Absolute refusal to pay Military Administration</tspan>
      <tspan x="27" dy="18">taxes, value-added levies, and licensing fines.</tspan>
      <tspan x="15" dy="20">• Total consumer boycott of Israeli manufactured goods</tspan>
      <tspan x="27" dy="18">where Palestinian alternatives exist (dairy, textiles).</tspan>
      <tspan x="15" dy="20">• Immediate resignation of appointed municipal councils.</tspan>
    </text>
  </g>

  <!-- Decree 3: Popular Committees -->
  <g transform="translate(50, 618)">
    <rect width="365" height="175" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" rx="5"/>
    <rect width="365" height="30" fill="#b45309" rx="5 5 0 0"/>
    <text x="14" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">3. POPULAR COMMITTEES (LIJAN)</text>
    <text x="350" y="20" font-family="'Traditional Arabic', serif" font-size="14" font-weight="bold" fill="#fde68a" text-anchor="end">اللجان الشعبية للحراسة والتعليم</text>
    <text x="15" y="52" font-family="'Georgia', serif" font-size="12" font-weight="bold" fill="#0f172a">Grassroots Self-Reliance Network:</text>
    <text x="15" y="72" font-family="'Georgia', serif" font-size="11.5" fill="#334155">
      <tspan x="15" dy="0">• Formation of clandestine neighborhood committees</tspan>
      <tspan x="27" dy="18">to organize household food cooperatives &amp; farming.</tspan>
      <tspan x="15" dy="20">• Clandestine home schooling ('popular education')</tspan>
      <tspan x="27" dy="18">in defiance of IDF military closure of all schools.</tspan>
      <tspan x="15" dy="20">• Night-watch defense guards against settler raids.</tspan>
    </text>
  </g>

  <!-- Decree 4: Days of Confrontation -->
  <g transform="translate(435, 618)">
    <rect width="365" height="175" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" rx="5"/>
    <rect width="365" height="30" fill="#991b1b" rx="5 5 0 0"/>
    <text x="14" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">4. DAYS OF POPULAR RAGE</text>
    <text x="350" y="20" font-family="'Traditional Arabic', serif" font-size="14" font-weight="bold" fill="#fecaca" text-anchor="end">أيام الغضب والمواجهة</text>
    <text x="15" y="52" font-family="'Georgia', serif" font-size="12" font-weight="bold" fill="#0f172a">Direct Civil Action &amp; Demonstrations:</text>
    <text x="15" y="72" font-family="'Georgia', serif" font-size="11.5" fill="#334155">
      <tspan x="15" dy="0">• Friday and Sunday designated Days of National Rage</tspan>
      <tspan x="27" dy="18">following mosque and church services.</tspan>
      <tspan x="15" dy="20">• Erection of stone barricades and burning tires</tspan>
      <tspan x="27" dy="18">to block military patrols from entering refugee camps.</tspan>
      <tspan x="15" dy="20">• Raise the banned Palestinian national flag.</tspan>
    </text>
  </g>

  <!-- Arabic Facsimile Inset Strip -->
  <g transform="translate(50, 810)">
    <rect width="750" height="100" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" rx="4"/>
    <text x="20" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#92400e" letter-spacing="1">AUTHENTIC MIMEOGRAPH EXTRACT (ARABIC FACSIMILE):</text>
    <text x="730" y="55" font-family="'Amiri', 'Traditional Arabic', serif" font-size="16" fill="#1e293b" text-anchor="end" direction="rtl">
      «إن شعبنا الفلسطيني العظيم في القدس والضفة والقطاع، وهو يواصل انتفاضته الباسلة، يؤكد للعالم أجمع أن سياسة كسر العظام والقبضة الحديدية لن تثنيه عن مواصلة كفاحه العادل حتى دحر الاحتلال وإقامة دولته المستقلة وعاصمتها القدس الشريف.»
    </text>
    <text x="20" y="85" font-family="'Courier New', monospace" font-size="10" fill="#78350f">
      [Excerpt: "Our great Palestinian people confirms that the policy of breaking bones and the Iron Fist will never deter its struggle..."]
    </text>
  </g>

  <!-- Archival Authentication Stamp & Signatures -->
  <g transform="translate(70, 930)">
    <!-- Red Stamp -->
    <g transform="rotate(-6)">
      <circle cx="90" cy="90" r="72" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" opacity="0.85"/>
      <circle cx="90" cy="90" r="62" fill="none" stroke="#dc2626" stroke-width="1.2" opacity="0.85"/>
      <path id="stamp-arc" d="M 40,90 A 50,50 0 1,1 140,90" fill="none"/>
      <text font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#dc2626" letter-spacing="1.5">
        <textPath href="#stamp-arc" startOffset="50%" text-anchor="middle">UNIFIED NATIONAL LEADERSHIP</textPath>
      </text>
      <text x="90" y="85" font-family="'Traditional Arabic', serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">القيادة الموحدة</text>
      <text x="90" y="105" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626" text-anchor="middle">FIELD COMMAND</text>
      <text x="90" y="120" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#dc2626" text-anchor="middle">FEB 1988 • JERUSALEM</text>
    </g>

    <!-- Archival Certification Box -->
    <g transform="translate(200, 20)">
      <rect width="510" height="135" fill="#f8fafc" stroke="#64748b" stroke-width="1" rx="4"/>
      <text x="18" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#1e293b" letter-spacing="0.5">ARCHIVAL PROVENANCE &amp; DISCIPLINARY CERTIFICATION</text>
      <text x="18" y="46" font-family="'Georgia', serif" font-size="11" fill="#475569">
        <tspan x="18" dy="0"><strong>Archive:</strong> Palestinian Academic Society for the Study of International Affairs (PASSIA)</tspan>
        <tspan x="18" dy="18"><strong>Collection:</strong> Clandestine Ephemera of the First Palestinian Intifada (1987–1993)</tspan>
        <tspan x="18" dy="18"><strong>Item Ref:</strong> Doc. UNLU-B10-1988 ("Bayan No. 10 — Call of Jerusalem")</tspan>
        <tspan x="18" dy="18"><strong>Historical Significance:</strong> Proves the uprising was coordinated by a decentralized, non-state</tspan>
        <tspan x="18" dy="17">civil network inside the territories, operating independently of the PLO leadership in Tunis.</tspan>
      </text>
    </g>
  </g>

  <!-- Reprographic Bottom Footer -->
  <line x1="40" y1="1120" x2="810" y2="1120" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="425" y="1142" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="1">THE HISTORY REVISION HUB • GCSE HISTORICAL EVIDENCE ARCHIVE • KS4 CONFLICT IN THE MIDDLE EAST</text>
</svg>