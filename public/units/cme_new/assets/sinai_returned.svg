<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Base Map -->
  <rect width="900" height="800" fill="#f8fafc"/>
  
  <!-- Map Title Banner / Archival Header -->
  <rect x="0" y="0" width="900" height="68" fill="#0f172a"/>
  <text x="24" y="28" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.5">MAP OF PHASED ISRAELI WITHDRAWAL FROM SINAI</text>
  <text x="24" y="48" font-size="12" font-weight="500" fill="#94a3b8">EGYPT-ISRAEL PEACE TREATY (1979) • SECURITY ZONES A, B, C, D &amp; MFO STATIONS (1979–1982)</text>
  <rect x="740" y="16" width="136" height="34" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="808" y="38" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">TREATY ANNEX I</text>

  <!-- Water Bodies -->
  <!-- Mediterranean Sea (North) -->
  <path d="M 0,68 L 900,68 L 900,160 C 720,160 520,150 350,170 C 200,185 80,180 0,190 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="125" font-size="14" font-weight="800" fill="#0284c7" text-anchor="middle" letter-spacing="2">MEDITERRANEAN SEA</text>

  <!-- Gulf of Suez (South-West) -->
  <path d="M 0,380 C 40,420 100,500 150,600 C 190,670 240,740 280,800 L 0,800 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text transform="translate(100, 680) rotate(-55)" font-size="13" font-weight="800" fill="#0284c7" letter-spacing="1.5">GULF OF SUEZ</text>

  <!-- Gulf of Aqaba (South-East) -->
  <path d="M 720,800 C 680,720 650,640 640,540 C 630,480 640,420 660,390 L 710,400 C 700,450 710,540 760,650 C 790,720 830,760 860,800 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text transform="translate(710, 640) rotate(70)" font-size="12" font-weight="800" fill="#0284c7" letter-spacing="1.5">GULF OF AQABA</text>

  <!-- Red Sea (South) -->
  <path d="M 280,800 C 350,780 430,760 480,790 C 530,820 620,810 720,800 Z" fill="#e0f2fe"/>
  <text x="500" y="785" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">Ras Mohammad</text>

  <!-- Suez Canal (West) -->
  <path d="M 120,180 L 120,270 L 110,310 L 120,380" stroke="#0284c7" stroke-width="6" fill="none"/>
  <text transform="translate(105, 290) rotate(-90)" font-size="10" font-weight="800" fill="#0369a1" letter-spacing="1">SUEZ CANAL</text>

  <!-- SINAI PENINSULA SECURITY ZONES (Treaty Annex I) -->

  <!-- ZONE A (West - up to ~50km east of Canal: 1 Egyptian Mechanized Division) -->
  <path d="M 120,180 L 250,175 L 280,380 L 220,580 L 150,600 L 110,380 Z" fill="#fef3c7" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="320" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">ZONE A</text>
  <text x="180" y="336" font-size="8.5" font-weight="700" fill="#d97706" text-anchor="middle">1 Egyptian Div.</text>
  <text x="180" y="348" font-size="8" font-weight="600" fill="#b45309" text-anchor="middle">(Max 22,000 troops)</text>

  <!-- ZONE B (Central - Light Egyptian border units: 4 Battalions) -->
  <path d="M 250,175 L 430,170 L 460,450 L 370,680 L 220,580 L 280,380 Z" fill="#ecfdf5" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
  <text x="350" y="360" font-size="13" font-weight="900" fill="#047857" text-anchor="middle">ZONE B</text>
  <text x="350" y="376" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">4 Border Bns.</text>
  <text x="350" y="388" font-size="8" font-weight="600" fill="#047857" text-anchor="middle">(Civil Police Arms)</text>

  <!-- ZONE C (Eastern Sinai - Demilitarized; Civil Police & MFO Peacekeepers) -->
  <path d="M 430,170 L 660,170 L 660,390 C 640,420 630,480 640,540 C 650,640 680,720 720,800 C 620,810 530,820 480,790 C 430,760 350,780 280,800 L 370,680 L 460,450 Z" fill="#eff6ff" fill-opacity="0.9" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="420" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">ZONE C</text>
  <text x="540" y="438" font-size="10" font-weight="800" fill="#2563eb" text-anchor="middle">DEMILITARIZED ZONE</text>
  <text x="540" y="452" font-size="8.5" font-weight="600" fill="#1e40af" text-anchor="middle">Egyptian Civil Police + MFO Force</text>

  <!-- ZONE D (Narrow Strip in Israel along border - Max 4 Infantry Bns) -->
  <path d="M 660,170 L 720,170 L 720,400 L 660,390 Z" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text transform="translate(685, 290) rotate(90)" font-size="9.5" font-weight="800" fill="#be185d" text-anchor="middle">ZONE D (Israel Strip)</text>

  <!-- WITHDRAWAL PHASE LINES -->
  <!-- Phase 1 Line (1979): El Arish to Ras Mohammad Line -->
  <path d="M 430,170 L 460,450 L 480,790" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 3"/>
  <rect x="360" y="240" width="130" height="24" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1" filter="url(#subtle-shadow)"/>
  <text x="425" y="256" font-size="8.5" font-weight="800" fill="#b91c1c" text-anchor="middle">PHASE 1 LINE (1979)</text>

  <!-- Phase 2 Line (1980): Central Staging -->
  <!-- Phase 3 / Final International Border Line (April 1982: Rafah to Taba) -->
  <path d="M 660,170 L 660,390" fill="none" stroke="#1e3a8a" stroke-width="4.5"/>
  <rect x="610" y="210" width="160" height="28" rx="3" fill="#1e3a8a" filter="url(#shadow)"/>
  <text x="690" y="228" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">FINAL BORDER (APRIL 1982)</text>

  <!-- Key Settlement & City Markers -->
  <!-- Yamit (Dismantled Israeli Settlement) -->
  <g transform="translate(640, 180)" filter="url(#subtle-shadow)">
    <circle cx="0" cy="0" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1"/>
    <text x="-8" y="-8" font-size="9.5" font-weight="800" fill="#991b1b" text-anchor="end">Yamit</text>
    <text x="-8" y="3" font-size="7.5" font-weight="600" fill="#b91c1c" text-anchor="end">(Evacuated Apr 1982)</text>
  </g>

  <!-- El Arish -->
  <circle cx="430" cy="180" r="5" fill="#0f172a"/>
  <text x="430" y="198" font-size="9.5" font-weight="800" fill="#0f172a" text-anchor="middle">El Arish</text>

  <!-- Taba / Eilat -->
  <circle cx="660" cy="395" r="5" fill="#1e3a8a"/>
  <text x="675" y="398" font-size="9.5" font-weight="800" fill="#1e3a8a">Taba / Eilat</text>

  <!-- Sharm el-Sheikh -->
  <circle cx="560" cy="760" r="5" fill="#0f172a"/>
  <text x="575" y="764" font-size="9.5" font-weight="800" fill="#0f172a">Sharm el-Sheikh</text>

  <!-- MFO (Multinational Force & Observers) Bases -->
  <!-- North Camp (El Gorah) -->
  <g transform="translate(610, 195)">
    <rect x="-8" y="-8" width="16" height="16" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="-12" y="4" font-size="8" font-weight="800" fill="#1d4ed8" text-anchor="end">MFO North Base</text>
  </g>
  <!-- South Camp (Sharm el-Sheikh) -->
  <g transform="translate(530, 740)">
    <rect x="-8" y="-8" width="16" height="16" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="-12" y="4" font-size="8" font-weight="800" fill="#1d4ed8" text-anchor="end">MFO South Base</text>
  </g>

  <!-- MAP COMPASS & SCALE -->
  <g transform="translate(60, 240)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    <polygon points="0,-14 4,-2 -4,-2" fill="#0f172a"/>
    <polygon points="0,14 4,2 -4,2" fill="#94a3b8"/>
    <text x="0" y="-18" font-size="8.5" font-weight="900" fill="#0f172a" text-anchor="middle">N</text>
  </g>
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="140" height="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>
    <rect x="10" y="6" width="60" height="6" fill="#0f172a"/>
    <rect x="70" y="6" width="60" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="10" y="4" font-size="7.5" font-weight="700" fill="#334155">0</text>
    <text x="70" y="4" font-size="7.5" font-weight="700" fill="#334155">50km</text>
    <text x="130" y="4" font-size="7.5" font-weight="700" fill="#334155">100km</text>
  </g>

  <!-- MAP LEGEND (Bottom Right Floating Card) -->
  <g transform="translate(570, 500)" filter="url(#shadow)">
    <rect width="310" height="270" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="310" height="28" rx="6 6 0 0" fill="#1e293b"/>
    <text x="155" y="19" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">TREATY SECURITY ZONES LEGEND</text>

    <!-- Zone A -->
    <rect x="14" y="38" width="22" height="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="46" y="50" font-size="9.5" font-weight="700" fill="#1e293b">Zone A: 1 Mechanized Infantry Div. (Egypt)</text>

    <!-- Zone B -->
    <rect x="14" y="62" width="22" height="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="46" y="74" font-size="9.5" font-weight="700" fill="#1e293b">Zone B: 4 Border Battalions (Light Arms)</text>

    <!-- Zone C -->
    <rect x="14" y="86" width="22" height="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="46" y="98" font-size="9.5" font-weight="700" fill="#1e293b">Zone C: Fully Demilitarized (MFO Monitors)</text>

    <!-- Zone D -->
    <rect x="14" y="110" width="22" height="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="46" y="122" font-size="9.5" font-weight="700" fill="#1e293b">Zone D: Israel Border Strip (4 Bns Only)</text>

    <!-- Phase 1 Line -->
    <line x1="14" y1="142" x2="36" y2="142" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="46" y="146" font-size="9.5" font-weight="700" fill="#1e293b">Phase 1 Line (El Arish–Ras Mohammad, 1979)</text>

    <!-- Final Border Line -->
    <line x1="14" y1="168" x2="36" y2="168" stroke="#1e3a8a" stroke-width="4"/>
    <text x="46" y="172" font-size="9.5" font-weight="700" fill="#1e293b">Final International Border (25 April 1982)</text>

    <!-- MFO Station -->
    <rect x="18" y="190" width="14" height="14" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/>
    <text x="46" y="201" font-size="9.5" font-weight="700" fill="#1e293b">MFO Peacekeeper Base Stations</text>

    <!-- Yamit Evacuation -->
    <circle cx="25" cy="224" r="5" fill="#dc2626"/>
    <text x="46" y="228" font-size="9.5" font-weight="700" fill="#1e293b">Yamit Settlement Evacuation Area</text>

    <!-- Footer Note -->
    <text x="155" y="258" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Egypt–Israel Peace Treaty (Signed 26 March 1979)</text>
  </g>
</svg>
